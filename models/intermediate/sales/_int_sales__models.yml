version: 2

models:
  - name: int_sales__order_items_enriched
    description: >
      Modelo intermediário que relaciona os itens dos pedidos aos respectivos
      pedidos de venda. Uma linha representa um item de produto vendido dentro
      de um pedido. O modelo preserva o grão de sales_order_detail_id e adiciona
      atributos do pedido necessários para análises e validações posteriores.

    columns:
      - name: sales_order_detail_id
        description: Identificador único do item do pedido de venda.
        data_tests:
          - not_null
          - unique

      - name: sales_order_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null

      - name: product_id
        description: Identificador do produto vendido no item.
        data_tests:
          - not_null

      - name: order_date
        description: Data em que o pedido de venda foi realizado.
        data_tests:
          - not_null

      - name: status
        description: Código de status do pedido de venda.

      - name: customer_id
        description: Identificador do cliente associado ao pedido.
        data_tests:
          - not_null

      - name: territory_id
        description: Identificador do território de vendas associado ao pedido.

      - name: bill_to_address_id
        description: Identificador do endereço de cobrança do pedido.
        data_tests:
          - not_null

      - name: ship_to_address_id
        description: Identificador do endereço de entrega do pedido.
        data_tests:
          - not_null

      - name: credit_card_id
        description: Identificador do cartão utilizado no pedido, quando aplicável.

      - name: order_quantity
        description: Quantidade de unidades do produto no item do pedido.
        data_tests:
          - not_null

      - name: unit_price
        description: Preço unitário do produto no momento da venda.
        data_tests:
          - not_null

      - name: unit_price_discount
        description: Taxa decimal de desconto aplicada ao preço unitário.
        data_tests:
          - not_null

      - name: gross_amount
        description: >
          Valor bruto do item, calculado como order_quantity multiplicado por
          unit_price.
        data_tests:
          - not_null

      - name: discount_amount
        description: >
          Valor do desconto do item, calculado como gross_amount multiplicado
          por unit_price_discount.
        data_tests:
          - not_null

      - name: net_amount
        description: >
          Valor líquido do item, calculado como gross_amount menos
          discount_amount.
        data_tests:
          - not_null

      - name: subtotal
        description: >
          Subtotal do pedido. Como o modelo está no grão de item, este valor se
          repete em todos os itens do mesmo pedido e não deve ser somado diretamente.

      - name: tax_amount
        description: >
          Valor de imposto do pedido. Repete-se nos itens do mesmo pedido e não
          deve ser somado diretamente neste grão.

      - name: freight_amount
        description: >
          Valor de frete do pedido. Repete-se nos itens do mesmo pedido e não
          deve ser somado diretamente neste grão.

      - name: total_due
        description: >
          Valor total devido do pedido. Repete-se nos itens do mesmo pedido e
          não deve ser somado diretamente neste grão.

      - name: item_modified_at
        description: Data e hora da última modificação do item do pedido.

      - name: order_modified_at
        description: Data e hora da última modificação do pedido.