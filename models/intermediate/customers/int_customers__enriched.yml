version: 2

models:
  - name: int_customers__enriched
    description: >
      Clientes enriquecidos com atributos de pessoa e loja.
      Cada registro representa um customer_id.

    columns:
      - name: customer_id
        description: Identificador único do cliente.
        data_tests:
          - not_null
          - unique

      - name: person_id
        description: Identificador da pessoa associada ao cliente.

      - name: person_type
        description: Tipo da pessoa associada ao cliente.

      - name: full_name
        description: Nome completo da pessoa associada ao cliente.

      - name: store_id
        description: Identificador da loja associada ao cliente, quando aplicável.

      - name: store_name
        description: Nome da loja associada ao cliente, quando aplicável.

      - name: territory_id
        description: Identificador do território comercial associado ao cliente.

      - name: modified_at
        description: Data da última alteração do cadastro de cliente.