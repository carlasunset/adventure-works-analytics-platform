version: 2

models:
  - name: stg_sales__customers
    description: >
      Clientes cadastrados pela Adventure Works.
      Cada registro representa um cliente, que pode estar associado
      a uma pessoa, a uma loja ou a ambos.

    columns:
      - name: customer_id
        description: Identificador único do cliente.
        data_tests:
          - not_null
          - unique

      - name: person_id
        description: >
          Identificador da pessoa associada ao cliente.
          Corresponde ao business_entity_id da pessoa e pode ser nulo.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_person__people')
                field: business_entity_id

      - name: store_id
        description: >
          Identificador da loja associada ao cliente empresarial.
          Corresponde ao business_entity_id da loja e pode ser nulo.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sales__stores')
                field: business_entity_id

      - name: territory_id
        description: Identificador do território comercial associado ao cliente.

      - name: modified_at
        description: Data da última alteração do registro na origem.


  - name: stg_person__people
    description: >
      Pessoas cadastradas pela Adventure Works.
      Cada registro representa uma pessoa identificada por um
      Business Entity ID.

    columns:
      - name: business_entity_id
        description: Identificador único da pessoa na estrutura de entidades do Adventure Works.
        data_tests:
          - not_null
          - unique

      - name: person_type
        description: Código que representa o tipo ou papel da pessoa na origem.

      - name: first_name
        description: Primeiro nome da pessoa.

      - name: middle_name
        description: Nome do meio da pessoa, quando disponível.

      - name: last_name
        description: Sobrenome da pessoa.

      - name: full_name
        description: Nome completo formado pelo primeiro nome, nome do meio e sobrenome.

      - name: modified_at
        description: Data da última alteração do registro na origem.


  - name: stg_sales__stores
    description: >
      Lojas cadastradas pela Adventure Works.
      Cada registro representa uma loja identificada por um
      Business Entity ID.

    columns:
      - name: business_entity_id
        description: Identificador único da loja na estrutura de entidades do Adventure Works.
        data_tests:
          - not_null
          - unique

      - name: store_name
        description: Nome da loja.
        data_tests:
          - not_null

      - name: sales_person_id
        description: >
          Identificador do vendedor responsável pela loja.
          Corresponde ao Business Entity ID do vendedor.

      - name: modified_at
        description: Data da última alteração do registro na origem.