version: 2

models:
  - name: stg_sales__sales_orders
    description: >
      Pedidos de venda da Adventure Works. Cada registro representa
      um único pedido realizado por um cliente.

    columns:
      - name: sales_order_id
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: order_date
        description: Data em que o pedido foi realizado.
        data_tests:
          - not_null

      - name: status
        description: Código do status do pedido.

      - name: customer_id
        description: Identificador do cliente que realizou o pedido.
        data_tests:
          - not_null

      - name: territory_id
        description: Identificador do território comercial associado ao pedido.

      - name: bill_to_address_id
        description: Identificador do endereço de cobrança.
        data_tests:
          - not_null

      - name: ship_to_address_id
        description: Identificador do endereço de entrega usado nas análises geográficas.
        data_tests:
          - not_null

      - name: credit_card_id
        description: Identificador do cartão usado no pedido. Pode ser nulo.

      - name: subtotal
        description: Valor subtotal dos produtos registrado no cabeçalho do pedido.

      - name: tax_amount
        description: Valor dos impostos do pedido.

      - name: freight_amount
        description: Valor do frete do pedido.

      - name: total_due
        description: Valor total do pedido, incluindo subtotal, impostos e frete.

      - name: order_modified_at
        description: Data da última alteração do registro na origem.

  - name: stg_sales__sales_order_items
    description: >
      Itens dos pedidos de venda da Adventure Works.
      Cada registro representa um produto vendido dentro de um pedido.

    columns:
      - name: sales_order_detail_id
        description: Identificador único do item do pedido.
        data_tests:
          - not_null
          - unique

      - name: sales_order_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__sales_orders')
                field: sales_order_id

      - name: product_id
        description: Identificador do produto vendido.
        data_tests:
          - not_null

      - name: order_quantity
        description: Quantidade vendida do produto no item.

      - name: unit_price
        description: Preço unitário do produto no momento da venda.

      - name: unit_price_discount
        description: Percentual de desconto aplicado ao preço unitário.

      - name: item_modified_at
        description: Data da última alteração do registro na origem.
  
  - name: stg_sales__credit_cards
    description: >
      Cartões utilizados nos pedidos de venda da Adventure Works.
      Cada registro representa um cartão cadastrado.

    columns:
      - name: credit_card_id
        description: Identificador único do cartão.
        data_tests:
          - not_null
          - unique

      - name: card_type
        description: Tipo do cartão.
        data_tests:
          - not_null

      - name: expiration_month
        description: Mês de expiração do cartão.

      - name: expiration_year
        description: Ano de expiração do cartão.

      - name: modified_at
        description: Data da última alteração do registro na origem.


  - name: stg_sales__sales_reasons
    description: >
      Motivos de venda cadastrados pela Adventure Works.
      Cada registro representa um motivo que pode ser associado a pedidos.

    columns:
      - name: sales_reason_id
        description: Identificador único do motivo de venda.
        data_tests:
          - not_null
          - unique

      - name: sales_reason_name
        description: Nome do motivo de venda.
        data_tests:
          - not_null

      - name: sales_reason_type
        description: Categoria do motivo de venda.

      - name: modified_at
        description: Data da última alteração do registro na origem.


  - name: stg_sales__sales_order_reasons
    description: >
      Associação entre pedidos e motivos de venda.
      Cada registro representa um motivo associado a um pedido.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_id
              - sales_reason_id

    columns:
      - name: sales_order_id
        description: Identificador do pedido associado ao motivo.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__sales_orders')
                field: sales_order_id

      - name: sales_reason_id
        description: Identificador do motivo associado ao pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__sales_reasons')
                field: sales_reason_id

      - name: modified_at
        description: Data da última alteração do registro na origem.