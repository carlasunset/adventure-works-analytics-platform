version: 2

sources:
  - name: adventure_works
    database: fea_academy
    schema: adventure_works
    description: Dados transacionais da Adventure Works.

    tables:
      - name: sales_salesorderheader
        description: Pedidos realizados pelos clientes.
        columns:
          - name: salesorderid
            description: Identificador único do pedido.
            tests:
              - not_null
              - unique

      - name: sales_salesorderdetail
        description: Produtos vendidos em cada pedido.
        columns:
          - name: salesorderdetailid
            description: Identificador único do item do pedido.
            tests:
              - not_null
              - unique

      - name: production_product
        description: Produtos cadastrados pela Adventure Works.
        columns:
          - name: productid
            description: Identificador único do produto.
            tests:
              - not_null
              - unique

          - name: name
            description: Nome do produto.
            tests:
              - not_null