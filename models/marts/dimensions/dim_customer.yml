version: 2

models:
  - name: dim_customer
    description: >
      Dimensão de clientes da Adventure Works utilizada nas análises de vendas.
      Cada registro representa um único customer_id do processo comercial,
      podendo estar associado a uma pessoa, a uma loja ou a ambas.

    config:
      contract:
        enforced: true
    
    columns:
      - name: customer_key
        description: Chave surrogate única da dimensão de cliente.
        data_type: string
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identificador natural do cliente.
        data_type: bigint
        data_tests:
          - not_null
          - unique

      - name: full_name
        description: >
          Nome completo da pessoa associada ao cliente.
          Pode ser nulo para clientes associados somente a uma loja.
        data_type: string

      - name: person_type
        description: Tipo da pessoa associada ao cliente conforme registrado na fonte, quando houver uma pessoa relacionada ao customer_id.
        data_type: string

      - name: store_name
        description: >
          Nome da loja associada ao cliente, quando aplicável.
          Pode ser nulo para clientes sem loja associada.
        data_type: string