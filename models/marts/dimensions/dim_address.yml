version: 2

models:
  - name: dim_address
    description: >
      Dimensão de endereços da Adventure Works utilizada nas análises geográficas
      de vendas. Cada registro representa um único address_id enriquecido com
      atributos de cidade, estado ou província e país.

    config:
      contract:
        enforced: true
    
    columns:
      - name: address_key
        description: Chave surrogate única da dimensão de endereço.
        data_type: string
        data_tests:
          - not_null
          - unique

      - name: address_id
        description: Identificador natural do endereço.
        data_type: bigint
        data_tests:
          - not_null
          - unique

      - name: city
        description: Cidade associada ao endereço.
        data_type: string
        data_tests:
          - not_null

      - name: state_province_code
        description: Código do estado ou província associado ao endereço.
        data_type: string

      - name: state_province_name
        description: Nome do estado ou província associado ao endereço.
        data_type: string
        data_tests:
          - not_null

      - name: country_region_code
        description: Código do país ou região associado ao endereço.
        data_type: string
        data_tests:
          - not_null

      - name: country_region_name
        description: Nome do país ou região associado ao endereço.
        data_type: string
        data_tests:
          - not_null