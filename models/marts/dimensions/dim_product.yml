version: 2

models:
  - name: dim_product
    description: >
      Dimensão de produtos da Adventure Works utilizada nas análises de vendas.
      Cada registro representa um único produto disponível no modelo analítico.

    config:
      contract:
        enforced: true

    columns:
      - name: product_key
        description: Chave surrogate única da dimensão de produto.
        data_type: string
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: Identificador natural do produto no sistema de origem.
        data_type: bigint
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Nome comercial do produto utilizado nas análises e agrupamentos.
        data_type: string
        data_tests:
          - not_null